# 纯静态站点：页面、脚本、数据都用相对路径，没有后端，不需要 SPA 回退。
server {
    # 只监听 IPv4：内核禁用 IPv6 的主机上 [::]:80 会让 nginx 起不来；Docker 端口映射在宿主机侧已支持 IPv6
    listen       80;
    server_name  _;
    charset utf-8;
    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;
    # 访问 /explore 时补斜杠用相对地址，否则端口映射（如 8080:80）下会跳到 :80
    absolute_redirect off;

    # 文件名不带哈希，统一让浏览器每次用 ETag 重新验证；离线由 sw.js 负责。
    # 注意：location 里一旦写 add_header，就不会继承这里的，所以下面的 location 只改类型。
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    # 默认值只压缩直连的 HTTP/1.1 请求；经过反向代理（带 Via，或 nginx proxy_pass 用的 HTTP/1.0）时也要压缩
    gzip_proxied      any;
    gzip_http_version 1.0;
    gzip_types        application/json application/javascript text/javascript text/css text/plain image/svg+xml application/manifest+json;

    # nginx 自带 mime.types 没有 webmanifest
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # assets/vendor/VENDOR.md 等：mime.types 没有 .md，否则会当下载文件
    location ~* \.md$ {
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
